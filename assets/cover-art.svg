<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#020810"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.12" stroke="#00d4ff" stroke-width="0.5">
    <line x1="51" y1="160" x2="461" y2="160"/>
    <line x1="51" y1="201" x2="461" y2="201"/>
    <line x1="51" y1="242" x2="461" y2="242"/>
    <line x1="51" y1="283" x2="461" y2="283"/>
    <line x1="51" y1="324" x2="461" y2="324"/>
    <line x1="51" y1="365" x2="461" y2="365"/>
    <line x1="92" y1="120" x2="92" y2="405"/>
    <line x1="133" y1="120" x2="133" y2="405"/>
    <line x1="174" y1="120" x2="174" y2="405"/>
    <line x1="215" y1="120" x2="215" y2="405"/>
    <line x1="256" y1="120" x2="256" y2="405"/>
    <line x1="297" y1="120" x2="297" y2="405"/>
    <line x1="338" y1="120" x2="338" y2="405"/>
    <line x1="379" y1="120" x2="379" y2="405"/>
    <line x1="420" y1="120" x2="420" y2="405"/>
  </g>

  <!-- Grid border -->
  <rect x="51" y="120" width="410" height="285" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.25"/>

  <!-- Ships (player 1 side - left) -->
  <!-- Heavy Fighter 4x1 -->
  <g opacity="0.85" filter="url(#glow)">
    <path d="M 114,186 L 172,179 L 260,186 L 172,193 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1.4"/>
    <path d="M 172,182 L 202,164 L 224,176 L 187,183 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1"/>
    <path d="M 172,190 L 202,208 L 224,196 L 187,189 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1"/>
    <ellipse cx="209" cy="186" rx="8" ry="4" fill="#0a3a5a" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="112" cy="186" r="6" fill="rgba(0,212,255,0.5)"/>
  </g>
  <!-- Fighter 3x1 -->
  <g opacity="0.7">
    <path d="M 155,227 L 196,220 L 260,227 L 196,234 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1.4"/>
    <path d="M 196,223 L 219,205 L 235,217 L 208,224 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1"/>
    <path d="M 196,231 L 219,249 L 235,237 L 208,230 Z" fill="#0a3a5a" stroke="#00d4ff" stroke-width="1"/>
    <ellipse cx="223" cy="227" rx="6" ry="4" fill="#0a3a5a" stroke="#00d4ff" stroke-width="0.8"/>
    <circle cx="153" cy="227" r="6" fill="rgba(0,212,255,0.4)"/>
  </g>

  <!-- Ships (player 2 side - right, hit markers) -->
  <g opacity="0.9" filter="url(#glow)">
    <path d="M 260,268 L 301,261 L 365,268 L 301,275 Z" fill="#5a0a1a" stroke="#ff4060" stroke-width="1.4"/>
    <path d="M 301,264 L 324,246 L 340,258 L 312,265 Z" fill="#5a0a1a" stroke="#ff4060" stroke-width="1"/>
    <path d="M 301,272 L 324,290 L 340,278 L 312,271 Z" fill="#5a0a1a" stroke="#ff4060" stroke-width="1"/>
    <ellipse cx="328" cy="268" rx="6" ry="4" fill="#5a0a1a" stroke="#ff4060" stroke-width="0.8"/>
    <circle cx="258" cy="268" r="6" fill="rgba(255,64,96,0.5)"/>
  </g>

  <!-- Hit markers -->
  <circle cx="133" cy="303" r="8" fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
  <circle cx="174" cy="303" r="8" fill="#ff4060" opacity="0.8" filter="url(#glow)"/>
  <line x1="168" y1="297" x2="180" y2="309" stroke="#ff4060" stroke-width="2"/>
  <line x1="180" y1="297" x2="168" y2="309" stroke="#ff4060" stroke-width="2"/>
  <circle cx="215" cy="303" r="8" fill="none" stroke="#4488ff" stroke-width="2" opacity="0.6"/>
  <circle cx="338" cy="344" r="8" fill="#ff4060" opacity="0.8"/>
  <line x1="332" y1="338" x2="344" y2="350" stroke="#ff4060" stroke-width="2"/>
  <line x1="344" y1="338" x2="332" y2="350" stroke="#ff4060" stroke-width="2"/>

  <!-- Water ripple effect -->
  <ellipse cx="174" cy="320" rx="20" ry="6" fill="none" stroke="#ff4060" stroke-width="1" opacity="0.4"/>
  <ellipse cx="174" cy="320" rx="30" ry="9" fill="none" stroke="#ff4060" stroke-width="0.5" opacity="0.2"/>

  <!-- Explosion particle -->
  <circle cx="174" cy="303" r="3" fill="#ffaa00" filter="url(#glow)" opacity="0.9"/>

  <!-- Divider line -->
  <line x1="80" y1="430" x2="432" y2="430" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>

  <!-- Main title -->
  <text x="256" y="82" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif"
        font-size="54" font-weight="900" letter-spacing="2"
        fill="url(#titleGrad)" filter="url(#strongGlow)">GALAXY</text>

  <!-- Subtitle -->
  <text x="256" y="118" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" letter-spacing="8"
        fill="#00d4ff" opacity="0.9">D U E L</text>

  <!-- Bottom tagline -->
  <text x="256" y="462" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="14" letter-spacing="3" fill="#4488ff" opacity="0.7">2 PLAYERS · COUCH MULTIPLAYER</text>

  <!-- AirConsole logo hint -->
  <text x="256" y="492" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.35">AIRCONSOLE</text>

  <!-- Corner decorations -->
  <line x1="30" y1="30" x2="60" y2="30" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="30" x2="30" y2="60" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="482" y1="30" x2="452" y2="30" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="482" y1="30" x2="482" y2="60" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="482" x2="60" y2="482" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="482" x2="30" y2="452" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="482" y1="482" x2="452" y2="482" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
  <line x1="482" y1="482" x2="482" y2="452" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
</svg>
