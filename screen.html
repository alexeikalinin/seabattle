<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
    <title>Battleship Duel</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #0a0a1a; overflow: hidden; }
      #game-container { width: 100%; height: 100%; }
      #game-container canvas { display: block; }

      /* Loading screen — shown instantly, hidden once Phaser canvas appears */
      #loading-screen {
        position: fixed; inset: 0;
        background: #0a0a1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 28px; z-index: 10;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #loading-screen .ls-title {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        letter-spacing: 0.06em;
        background: linear-gradient(135deg, #5ac8fa 0%, #2d8cf0 60%, #5ac8fa 100%);
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: ls-shine 2.5s linear infinite;
        text-align: center;
      }
      #loading-screen .ls-anchor {
        font-size: clamp(2rem, 4vw, 3rem);
        animation: ls-bob 1.8s ease-in-out infinite;
        display: block;
      }
      #loading-screen .ls-bar-wrap {
        width: min(320px, 60vw);
        height: 4px;
        background: rgba(90,200,250,0.15);
        border-radius: 99px;
        overflow: hidden;
      }
      #loading-screen .ls-bar {
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, #5ac8fa, #2d8cf0);
        animation: ls-fill 1.8s ease-in-out infinite;
        box-shadow: 0 0 12px rgba(90,200,250,0.6);
      }
      #loading-screen .ls-sub {
        font-size: clamp(0.7rem, 2vw, 0.9rem);
        color: rgba(90,200,250,0.45);
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      @keyframes ls-shine { to { background-position: 200% center; } }
      @keyframes ls-bob   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
      @keyframes ls-fill  {
        0%   { width: 0%;   opacity: 1; }
        80%  { width: 100%; opacity: 1; }
        100% { width: 100%; opacity: 0; }
      }
    </style>
    <script src="/airconsole-1.9.0.js"></script>
  </head>
  <body>
    <!--
      Portrait auto-rotate: injected BEFORE Phaser loads.

      Problem: projectors / smart-TVs often run their browsers in portrait
      mode (height > width). Phaser uses getBoundingClientRect() to measure
      its parent, which returns the POST-transform visual box — so any CSS
      rotation on the container breaks Phaser's size calculation.

      Solution: leave #game-container unrotated (Phaser measures it correctly),
      then inject a stylesheet with !important rules that force the CANVAS
      Phaser creates into a fixed-position, landscape-sized, rotated box.
      !important beats Phaser's inline styles without needing to fight them.

      Math for portrait viewport W × H (H > W):
        canvas CSS: left=W, top=0, width=H, height=W
        transform-origin: top left  → pivot at viewport (W, 0)
        rotate(90° CW):
          BL (local 0, W) → viewport (W − W, 0) = (0, 0)   ← top-left of wall
          TR (local H, 0) → viewport (W, H)                 ← bottom-right of wall
        ∴ canvas visually covers exactly 0..W × 0..H = full viewport ✓
        Phaser renders 1920×1080 displayed at H × W CSS pixels (aspect-correct) ✓
    -->
    <script>
      (function () {
        var W = window.innerWidth, H = window.innerHeight;
        if (H <= W) return; // already landscape — nothing to do

        var style = document.createElement('style');
        style.textContent = [
          '#game-container canvas {',
          '  position:fixed !important;',
          '  top:0 !important;',
          '  left:' + W + 'px !important;',
          '  width:' + H + 'px !important;',
          '  height:' + W + 'px !important;',
          '  transform-origin:top left !important;',
          '  transform:rotate(90deg) !important;',
          '  margin:0 !important;',
          '}',
        ].join('\n');
        document.head.appendChild(style);
      })();
    </script>

    <!-- Instant loading screen — visible before Phaser boots -->
    <div id="loading-screen">
      <span class="ls-anchor">⚓</span>
      <div class="ls-title">BATTLESHIP<br>DUEL</div>
      <div class="ls-bar-wrap"><div class="ls-bar"></div></div>
      <div class="ls-sub">Loading…</div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/src/screen/main.ts"></script>

    <script>
      // Hide loading screen as soon as Phaser creates its canvas
      new MutationObserver(function(_, obs) {
        if (document.querySelector('#game-container canvas')) {
          var ls = document.getElementById('loading-screen');
          if (ls) {
            ls.style.transition = 'opacity 0.4s ease';
            ls.style.opacity = '0';
            setTimeout(function() { ls.remove(); }, 420);
          }
          obs.disconnect();
        }
      }).observe(document.getElementById('game-container'), { childList: true });
    </script>
  </body>
</html>
