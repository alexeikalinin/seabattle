<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
    <title>Battleship Duel</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #0a0a1a; overflow: hidden; }
      #game-container { width: 100%; height: 100%; }
      #game-container canvas { display: block; }
    </style>
    <script src="/airconsole-1.9.0.js"></script>
  </head>
  <body>
    <!--
      Portrait auto-rotate: injected BEFORE Phaser loads.

      Problem: projectors / smart-TVs often run their browsers in portrait
      mode (height > width). Phaser uses getBoundingClientRect() to measure
      its parent, which returns the POST-transform visual box — so any CSS
      rotation on the container breaks Phaser's size calculation.

      Solution: leave #game-container unrotated (Phaser measures it correctly),
      then inject a stylesheet with !important rules that force the CANVAS
      Phaser creates into a fixed-position, landscape-sized, rotated box.
      !important beats Phaser's inline styles without needing to fight them.

      Math for portrait viewport W × H (H > W):
        canvas CSS: left=W, top=0, width=H, height=W
        transform-origin: top left  → pivot at viewport (W, 0)
        rotate(90° CW):
          BL (local 0, W) → viewport (W − W, 0) = (0, 0)   ← top-left of wall
          TR (local H, 0) → viewport (W, H)                 ← bottom-right of wall
        ∴ canvas visually covers exactly 0..W × 0..H = full viewport ✓
        Phaser renders 1920×1080 displayed at H × W CSS pixels (aspect-correct) ✓
    -->
    <script>
      (function () {
        var W = window.innerWidth, H = window.innerHeight;
        if (H <= W) return; // already landscape — nothing to do

        var style = document.createElement('style');
        style.textContent = [
          '#game-container canvas {',
          '  position:fixed !important;',
          '  top:0 !important;',
          '  left:' + W + 'px !important;',
          '  width:' + H + 'px !important;',
          '  height:' + W + 'px !important;',
          '  transform-origin:top left !important;',
          '  transform:rotate(90deg) !important;',
          '  margin:0 !important;',
          '}',
        ].join('\n');
        document.head.appendChild(style);
      })();
    </script>

    <div id="game-container"></div>
    <script type="module" src="/src/screen/main.ts"></script>
  </body>
</html>
