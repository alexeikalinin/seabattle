<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
    <title>Battleship Duel</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #0a0a1a; overflow: hidden; }
      #game-container { width: 100%; height: 100%; }
      #game-container canvas { display: block; }

      /* Portrait-mode warning — shown when screen is taller than wide */
      #orientation-warning {
        display: none;
        position: fixed;
        inset: 0;
        background: #030e1e;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #orientation-warning .ow-icon { font-size: 72px; animation: ow-spin 2s ease-in-out infinite; }
      #orientation-warning .ow-text {
        color: #c8e4f4;
        font-size: clamp(18px, 4vw, 28px);
        text-align: center;
        line-height: 1.5;
      }
      #orientation-warning .ow-text strong { color: #5ac8fa; }
      @keyframes ow-spin {
        0%   { transform: rotate(0deg); }
        40%  { transform: rotate(90deg); }
        60%  { transform: rotate(90deg); }
        100% { transform: rotate(0deg); }
      }
      @media screen and (orientation: portrait) {
        #orientation-warning { display: flex; }
      }
    </style>
    <script src="/airconsole-1.9.0.js"></script>
  </head>
  <body>
    <!-- Shown when the TV/projector is accidentally in portrait orientation -->
    <div id="orientation-warning">
      <div class="ow-icon">🔄</div>
      <div class="ow-text">
        Please rotate your display to<br>
        <strong>Landscape</strong> mode
      </div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/src/screen/main.ts"></script>
    <script>
      // Attempt to lock orientation on supported devices (mobile browsers, some tablets)
      if (screen.orientation && typeof screen.orientation.lock === 'function') {
        screen.orientation.lock('landscape').catch(function() {});
      }
    </script>
  </body>
</html>
